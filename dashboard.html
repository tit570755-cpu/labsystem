<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LEAC UNOPAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebarContainer"></div>
  <main class="main-content">
    <div id="topbarContainer"></div>
    <div class="page-content">

      <!-- Stats row -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" id="statPendentes">—</div>
          <div class="stat-label">Pendentes</div>
          <div class="stat-change" id="statUrgentes"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💉</div>
          <div class="stat-value" id="statColeta">—</div>
          <div class="stat-label">Em Coleta</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🧪</div>
          <div class="stat-value" id="statAnalise">—</div>
          <div class="stat-label">Em Análise</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="statLiberados">—</div>
          <div class="stat-label">Liberados Hoje</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-value" id="statPacientes">—</div>
          <div class="stat-label">Total Pacientes</div>
          <div class="stat-change up" id="statNovosMes"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-value" id="statFaturamento">—</div>
          <div class="stat-label">Faturamento Mês</div>
        </div>
      </div>

      <!-- Middle row: Recent reqs + top exams -->
      <div style="display:grid; grid-template-columns:1fr 380px; gap:20px;">

        <!-- Recent Requisitions -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">📋 Requisições Recentes</span>
            <button class="btn btn-ghost btn-sm" onclick="window.location.href='requisicoes.html'">Ver todas →</button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Nº Requisição</th>
                  <th>Paciente</th>
                  <th>Status</th>
                  <th>Urgente</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="tabelaRecentes"></tbody>
            </table>
          </div>
        </div>

        <!-- Top exams panel -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">🏆 Exames + Solicitados</span>
          </div>
          <div style="padding:16px;">
            <div id="topExamesChart" class="chart-bar-container">
              <div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.85rem;">Carregando...</div>
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom row: Status distribution + quick actions -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">

        <!-- Status dist -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">📊 Distribuição de Status</span>
          </div>
          <div style="padding:20px;" id="statusDistChart"></div>
        </div>

        <!-- Quick actions -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">⚡ Acesso Rápido</span>
          </div>
          <div style="padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button class="btn btn-primary" style="flex-direction:column;gap:8px;padding:20px;height:auto;" onclick="window.location.href='requisicoes.html'">
              <span style="font-size:1.8rem;">📋</span>
              <span>Nova Requisição</span>
            </button>
            <button class="btn btn-success" style="flex-direction:column;gap:8px;padding:20px;height:auto;" onclick="window.location.href='pacientes.html'">
              <span style="font-size:1.8rem;">👤</span>
              <span>Novo Paciente</span>
            </button>
            <button class="btn btn-ghost" style="flex-direction:column;gap:8px;padding:20px;height:auto;border-color:rgba(0,184,212,0.3);" onclick="window.location.href='laudos.html'">
              <span style="font-size:1.8rem;">📄</span>
              <span>Ver Laudos</span>
            </button>
            <button class="btn btn-ghost" style="flex-direction:column;gap:8px;padding:20px;height:auto;border-color:rgba(0,184,212,0.3);" onclick="window.location.href='relatorios.html'">
              <span style="font-size:1.8rem;">📈</span>
              <span>Relatórios</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
requireAuth();
document.getElementById('sidebarContainer').innerHTML = renderSidebar();
document.getElementById('topbarContainer').innerHTML = renderTopbar('Dashboard', 'Visão geral operacional do laboratório');
initSidebar('dashboard');

async function loadDashboard() {
  try {
    const d = await apiRequest('/dashboard');

    document.getElementById('statPendentes').textContent = d.hoje.pendentes;
    document.getElementById('statColeta').textContent = d.hoje.em_coleta;
    document.getElementById('statAnalise').textContent = d.hoje.em_analise;
    document.getElementById('statLiberados').textContent = d.hoje.liberados;
    document.getElementById('statPacientes').textContent = d.pacientes.total;
    document.getElementById('statFaturamento').textContent =
      d.mes.faturamento.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    if (d.hoje.urgentes > 0) {
      document.getElementById('statUrgentes').innerHTML =
        `<span style="color:var(--danger-light);">🚨 ${d.hoje.urgentes} urgente(s)</span>`;
    }

    if (d.pacientes.novos_mes > 0) {
      document.getElementById('statNovosMes').innerHTML =
        `↑ ${d.pacientes.novos_mes} novos este mês`;
    }

    // Recent requisitions
    const tbody = document.getElementById('tabelaRecentes');
    if (!d.ultimas_requisicoes?.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">📋</div><h3>Nenhuma requisição</h3></div></td></tr>`;
    } else {
      tbody.innerHTML = d.ultimas_requisicoes.map(r => `
        <tr style="cursor:pointer;" onclick="window.location.href='requisicoes.html'">
          <td style="font-family:monospace;font-size:0.78rem;font-weight:700;">${r.numero}</td>
          <td style="font-weight:600;">${r.paciente_nome}</td>
          <td>${formatStatus(r.status)}</td>
          <td>${r.urgente ? '<span class="urgente-dot"></span><span style="font-size:0.72rem;color:var(--danger);">URGENTE</span>' : '—'}</td>
          <td style="font-size:0.78rem;color:var(--text-muted);">${formatDateTime(r.data_solicitacao)}</td>
        </tr>
      `).join('');
    }

    // Top exams chart
    const chart = document.getElementById('topExamesChart');
    if (d.exames_mais_solicitados?.length) {
      const max = d.exames_mais_solicitados[0].total;
      chart.innerHTML = d.exames_mais_solicitados.map(e => `
        <div class="chart-bar-row">
          <div class="chart-bar-label" title="${e.nome}">${e.nome}</div>
          <div class="chart-bar-track">
            <div class="chart-bar-fill" style="width:${(e.total/max*100).toFixed(0)}%"></div>
          </div>
          <div class="chart-bar-value">${e.total}</div>
        </div>
      `).join('');
    } else {
      chart.innerHTML = '<p style="color:var(--text-muted);text-align:center;font-size:0.85rem;">Nenhum dado ainda</p>';
    }

    // Status distribution
    const statusColors = {
      pendente: '#f59e0b', coleta: '#00b8d4', triagem: '#0056a6',
      analise: '#7c3aed', liberado: '#00a651', cancelado: '#dc2626'
    };
    const statusLabels = {
      pendente: 'Pendente', coleta: 'Em Coleta', triagem: 'Triagem',
      analise: 'Em Análise', liberado: 'Liberado', cancelado: 'Cancelado'
    };
    const totalReqs = d.por_status_semana?.reduce((s, x) => s + x.count, 0) || 1;
    document.getElementById('statusDistChart').innerHTML = (d.por_status_semana || [])
      .filter(s => s.count > 0)
      .map(s => `
        <div class="chart-bar-row" style="margin-bottom:10px;">
          <div class="chart-bar-label">${statusLabels[s.status] || s.status}</div>
          <div class="chart-bar-track">
            <div class="chart-bar-fill" style="width:${(s.count/totalReqs*100).toFixed(0)}%;background:${statusColors[s.status] || '#888'};"></div>
          </div>
          <div class="chart-bar-value">${s.count}</div>
        </div>
      `).join('') || '<p style="color:var(--text-muted);text-align:center;font-size:0.85rem;">Nenhum dado ainda</p>';

  } catch (err) {
    showToast('Erro ao carregar dashboard', 'error');
  }
}

loadDashboard();
</script>
</body>
</html>
