<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabSystem - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <div class="login-logo">
                <i class="fa-solid fa-flask-vial"></i> LabSystem
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail Corporativo</label>
                    <input type="email" id="email" class="form-control" placeholder="usuario@labsystem.com.br">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                </div>
                
                <div class="form-group flex justify-between items-center" style="margin-bottom: 1.5rem;">
                    <label class="flex items-center gap-2" style="font-size: 0.875rem; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" style="font-size: 0.875rem;">Esqueceu a senha?</a>
                </div>
                
                <div id="login-error" style="display: none; margin-bottom: 1rem; font-size: 0.875rem; text-align: center; color: var(--danger-color); background: rgba(239, 68, 68, 0.1); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(239, 68, 68, 0.2); animation: shake 0.4s ease-in-out;">
                    <i class="fa-solid fa-circle-exclamation"></i> <span>E-mail ou senha incorretos.</span>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                    Entrar no Sistema <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 2rem; font-size: 0.75rem; color: var(--text-muted);">
                <p>Acesso restrito a funcionários autorizados.</p>
                <p>Monitorado conforme LGPD e políticas de segurança.</p>
                <div style="margin-top: 1rem; padding: 0.75rem; background: var(--bg-input); border-radius: 0.5rem; text-align: left;">
                    <strong style="display: block; margin-bottom: 0.5rem; text-align: center; color: var(--primary-color);">Contas de Demonstração (Senha: 123)</strong>
                    <div class="flex justify-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem;"><span>Admin:</span> <code>admin@lab.com</code></div>
                    <div class="flex justify-between" style="border-bottom: 1px solid var(--border-color); padding: 0.25rem 0;"><span>Biomédico:</span> <code>bio@lab.com</code></div>
                    <div class="flex justify-between" style="padding-top: 0.25rem;"><span>Recepção:</span> <code>recepcao@lab.com</code></div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
