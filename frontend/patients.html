<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - LEAC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand" style="display: flex; justify-content: center; padding: 1.5rem 0;">
                <img src="assets/img/logo.jpg" alt="LEAC Unopar" style="max-width: 80%; border-radius: 8px;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="patients.html" class="nav-item active"><i class="fa-solid fa-users"></i> Pacientes</a>
                <a href="requests.html" class="nav-item"><i class="fa-solid fa-file-medical"></i> Requisições</a>
                <a href="exams.html" class="nav-item"><i class="fa-solid fa-vial"></i> Exames & Resultados</a>
                <a href="reports.html" class="nav-item"><i class="fa-solid fa-file-pdf"></i> Laudos</a>
                <a href="finance.html" class="nav-item admin-only"><i class="fa-solid fa-wallet"></i> Financeiro</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <span style="color: var(--text-muted); font-size: 0.875rem;">Gestão de Cadastros</span>
                    <div style="font-weight: 600; font-size: 1.1rem;">Pacientes</div>
                </div>
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="user-name">User</span>
                    <button id="logoutBtn" class="btn btn-danger" style="margin-left: 1rem;"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Pacientes Cadastrados</h1>
                    <button class="btn btn-primary" onclick="document.getElementById('patientModal').classList.add('active')">
                        <i class="fa-solid fa-plus"></i> Novo Paciente
                    </button>
                </div>

                <div class="card">
                    <div class="form-group flex gap-4" style="margin-bottom: 1.5rem;">
                        <input type="text" class="form-control" placeholder="Buscar por nome ou CPF..." style="flex-grow: 1;">
                        <button class="btn btn-secondary"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome Completo</th>
                                    <th>CPF</th>
                                    <th>Data Nascimento</th>
                                    <th>Telefone</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="patients-list">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Patient Modal -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Cadastrar Novo Paciente</h2>
                <button class="modal-close" onclick="document.getElementById('patientModal').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addPatientForm">
                    <div class="form-group">
                        <label class="form-label">Nome Completo *</label>
                        <input type="text" id="p_name" class="form-control" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">CPF *</label>
                            <input type="text" id="p_cpf" class="form-control" placeholder="000.000.000-00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Data de Nascimento *</label>
                            <input type="date" id="p_birth" class="form-control" required>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Telefone</label>
                            <input type="text" id="p_phone" class="form-control" placeholder="(00) 00000-0000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sexo</label>
                            <select id="p_gender" class="form-control">
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="card" style="background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); padding: 1rem; margin-top: 1rem;">
                        <h3 style="font-size: 0.875rem; color: var(--secondary-color); margin-bottom: 0.5rem;"><i class="fa-solid fa-shield-halved"></i> Termo de Consentimento LGPD</h3>
                        <label class="flex items-center gap-2" style="font-size: 0.875rem;">
                            <input type="checkbox" id="p_lgpd" required> O paciente autoriza o tratamento de seus dados pessoais sensíveis para fins de realização de exames laboratoriais, conforme Lei 13.709/2018.
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="document.getElementById('patientModal').classList.remove('active')">Cancelar</button>
                <button class="btn btn-primary" onclick="savePatient()">Salvar Cadastro</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadPatients);

        function loadPatients() {
            const patients = window.db.get('patients');
            const tbody = document.getElementById('patients-list');
            tbody.innerHTML = '';
            
            patients.forEach(p => {
                // simple age calc
                const birth = new Date(p.birth_date);
                const age = Math.floor((new Date() - birth) / (365.25 * 24 * 60 * 60 * 1000));
                
                tbody.innerHTML += `
                    <tr>
                        <td>#${p.id}</td>
                        <td><strong>${p.full_name}</strong></td>
                        <td>${p.cpf}</td>
                        <td>${new Date(p.birth_date).toLocaleDateString('pt-BR')} (${age} anos)</td>
                        <td>${p.phone}</td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-primary" style="padding: 0.25rem 0.5rem;" title="Nova Requisição"><i class="fa-solid fa-file-medical"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function savePatient() {
            const form = document.getElementById('addPatientForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const newPatient = {
                full_name: document.getElementById('p_name').value,
                cpf: document.getElementById('p_cpf').value,
                birth_date: document.getElementById('p_birth').value,
                phone: document.getElementById('p_phone').value,
                gender: document.getElementById('p_gender').value,
                lgpd_consent: true,
                lgpd_date: new Date().toISOString()
            };

            window.db.add('patients', newPatient);
            document.getElementById('patientModal').classList.remove('active');
            form.reset();
            loadPatients();
            
            alert('Paciente cadastrado com sucesso!');
        }
    </script>
</body>
</html>
